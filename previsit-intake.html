<style>

}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small{font-size:13px}
.mut{color:var(--mut)}
h1{font-size:20px;line-height:1.3;margin-block-end:10px}

<body>
<!--
DIRECTION CONTRACT · previsit-intake.html · mode operate · user-pinned direction
THESIS: the intake is a conversation with the clinic, not a form. Every answer
  becomes a sent message the caregiver can tap to change; nothing reads as fields.
OWN-WORLD: WhatsApp anatomy in clinic blue. Deep-blue header with the Gordon logo
  avatar and kebab; dotted blue-tinted wallpaper; white clinic bubbles with the
  sharp corner toward the logo avatar; caregiver answers in light-blue bubbles with
  a generic person mark; quick-reply pills (selected = solid blue); composer with a
  textless continuous progress bar above skip/next; solid plane "send" only at the end.
STORY: she arrives from the clinic's SMS, logs in, chats her answers, hands over
  named documents, taps any bubble to fix, sends once, and knows Dr. Oren reads it.
FIRST VIEWPORT: chat header, greeting bubbles with the appointment card and the
  promise, full-width "let's begin" pill. No form furniture anywhere.
FORM: chat skin per design-chat-final.html, chosen by the team over 7 rounds
  (boards: design-explorations.html, design-chat-explorations.html). User-pinned.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
  review, the verdict, and DESIGN.md
-->

/* ================= 6.3 STATE ================= */
const FRESH = () => ({
  locale:"he", loggedIn:false, phone:"", respondent:null, branch:null,
  answers:{}, cards:{}, note:"", submitted:false, rescheduledTo:null,
  screen:"splash"                           // instructions first, then the gate; nothing medical before it
});
let STATE = FRESH();
let MEM = null;                       // in-memory fallback when localStorage is blocked
const KEY = "previsit_demo_v1";

const UI = {
  menuOpen:false, sheet:null, loader:null, toast:null,
  returnTo:null, resFrom:null, resDone:false,
  followCard:null, offerCard:null,
  cam:"idle", stream:null, captured:null,
  readLoading:false, readDraft:null,
  resendLeft:0, lastScreen:null, focus:null, revClosed:{}
};

function saveState(){
  try { localStorage.setItem(KEY, JSON.stringify(STATE)); }
  catch(e){ MEM = JSON.parse(JSON.stringify(STATE)); }
}
function loadState(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){ s = MEM; }
  if (s && typeof s === "object"){
    STATE = Object.assign(FRESH(), s);
    Object.values(STATE.cards || {}).forEach(c => (c.files || []).forEach(f => { f.objectUrl = null; }));
    if (!STATE.loggedIn && STATE.screen !== "login_phone" && STATE.screen !== "login_code") STATE.screen = "splash";  // nothing medical renders before the gate
    if (/^(capture|read):/.test(STATE.screen)) STATE.screen = "docs";   // transient sub-screens do not resume
    if (STATE.screen === "login_code") STATE.screen = "login_phone";
  }
}

/* ================= derivation helpers ================= */
const BRANCH_OF = { cough:"A", noisy:"B", breathless:"C", infections:"D", other:"other" };
function q(id){ return CASE.questions.find(x => x.id === id); }
function st(id){ return STATE.answers[id]; }
function t(k){ return (STRINGS[STATE.locale] && STRINGS[STATE.locale][k]) ?? STRINGS.en[k] ?? k; }
function L(o){ return o ? (o[STATE.locale] ?? o.en ?? "") : ""; }
function fmt(s, map){ return s.replace(/\{(\w+)\}/g, (_, k) => map[k] !== undefined ? map[k] : "{"+k+"}"); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function plural(n, k1, kn){ return n === 1 ? t(k1) : fmt(t(kn), { n }); }

function currentBranch(){
  const a = st("q1");
  if (!a || a.status !== "answered") return null;
  return BRANCH_OF[a.value] || null;
}
function showIfOk(c){
  if (!c) return true;
  const a = st(c.questionId);
  if (!a || a.status !== "answered") return false;      // unknown / skipped never satisfy a showIf
  const v = a.value;
  return Array.isArray(v) ? v.some(x => c.in.includes(x)) : c.in.includes(v);
}
function isActiveQ(qd){
  if (qd.branch && qd.branch !== currentBranch()) return false;
  if (qd.parent){ const p = q(qd.parent); if (!p || !isActiveQ(p)) return false; }
  return showIfOk(qd.showIf);
}
function pathQuestions(){ return CASE.questions.filter(x => x.screen && !x.notInPath && isActiveQ(x)); }

/* card presence is derived, never stored */
function namedCards(){
  return CASE.cards.filter(c => c.id !== "DX").filter(c => {
    if (c.base) return true;
    const qd = q(c.trigger.questionId);
    if (!qd || !isActiveQ(qd)) return false;
    const a = st(c.trigger.questionId);
    if (!a || a.status !== "answered") return false;
    return Array.isArray(a.value) ? a.value.includes(c.trigger.optionId) : a.value === c.trigger.optionId;
  });
}
function cardState(id){
  if (!STATE.cards[id]) STATE.cards[id] = { status:"untouched", files:[], extracted:null, opened:false };
  return STATE.cards[id];
}
function pruneCards(){
  const keep = new Set(namedCards().map(c => c.id)); keep.add("DX");
  Object.keys(STATE.cards).forEach(k => { if (!keep.has(k)) delete STATE.cards[k]; });
}

/* only a change to q1 clears answers */
function q1Changed(newBranch){
  CASE.questions.forEach(x => { if (x.branch && x.branch !== newBranch) delete STATE.answers[x.id]; });
  pruneCards();
}
function syncSecondHand(){
  const a8 = st("q8"); if (!a8) return;
  const a = st("q8a");
  a8.secondHand = !!(a && a.status === "answered" && a.value === "someone_else");
}

function setSingle(qid, optId){
  if (qid === "q1"){
    const prev = st("q1");
    const prevV = prev && prev.status === "answered" ? prev.value : undefined;
    if (prevV !== optId) q1Changed(BRANCH_OF[optId] || null);
  }
  const ex = st(qid) || {};
  STATE.answers[qid] = {
    status:"answered", value:optId,
    detail:(ex.status === "answered" && ex.value === optId) ? ex.detail : null,
    confidence:ex.confidence || null, secondHand:false
  };
  if (qid === "respondent") STATE.respondent = optId;
  if (qid === "q8a") syncSecondHand();
  STATE.branch = currentBranch();
  const o = (q(qid).options || []).find(x => x.id === optId);
  if (o && o.detail) UI.focus = "#det_" + qid;
}

function toggleMulti(qid, optId){
  const qd = q(qid); const a = st(qid);
  let arr = (a && a.status === "answered" && Array.isArray(a.value)) ? a.value.slice() : [];
  if (arr.includes(optId)) arr = arr.filter(x => x !== optId);
  else if ((qd.exclusiveOptions || []).includes(optId)) arr = [optId];
  else { arr = arr.filter(x => !(qd.exclusiveOptions || []).includes(x)); arr.push(optId); }
  if (!arr.length) delete STATE.answers[qid];
  else STATE.answers[qid] = { status:"answered", value:arr, detail:(a && a.detail) || null, confidence:(a && a.confidence) || null, secondHand:false };
  pruneCards();
}

function stopStream(){
  if (UI.stream){ UI.stream.getTracks().forEach(x => x.stop()); UI.stream = null; }
  UI.cam = "idle";
}

function goto(s){
  if (/^capture:/.test(STATE.screen) && !/^read:/.test(s)) stopStream();
  STATE.screen = s;
  UI.playAnim = true;                                    // entrance animations play on transitions, never on re-renders
  UI.followCard = null; UI.offerCard = UI.offerCard && s === "docs" ? UI.offerCard : null;
  if (/^read:/.test(s)){
    const id = s.split(":")[1];
    const c = CASE.cards.find(x => x.id === id);
    UI.readDraft = c.read
      ? { docType:L(c.read.docType), date:L(c.read.date), place:L(c.read.place), childName:L(c.read.childName) }
      : { docType:t("notSureVal"), date:"", place:"", childName:"" };
    UI.readLoading = true;
    setTimeout(() => { UI.readLoading = false; render(); }, 1500);   // 10.1 faked document reading
  }
  saveState(); render();
}

function backTarget(){
  const s = STATE.screen;
  if (UI.returnTo === "review" && (s === "respondent" || s === "docs" || s === "note" || s.startsWith("q:"))) return "review";
  if (s === "login_code") return "login_phone";
  if (s === "login_phone") return "login_phone";        // first screen, no back
  if (s === "respondent") return "landing";
  if (s.startsWith("q:")){
    const p = pathQuestions(); const i = p.findIndex(x => "q:" + x.id === s);
    return i > 0 ? "q:" + p[i-1].id : "respondent";
  }
  if (s === "docs"){ const p = pathQuestions(); return p.length ? "q:" + p[p.length-1].id : "respondent"; }
  if (s.startsWith("capture:") || s.startsWith("read:")) return "docs";
  if (s === "note") return "docs";
  if (s === "review") return "note";
  if (s === "sent") return "review";
  if (s === "reschedule") return UI.resFrom || "docs";
  return "landing";
}

function toast(msg){
  UI.toast = msg; render();
  setTimeout(() => { UI.toast = null; const el = document.querySelector(".toast"); if (el) el.remove(); }, 2400);
}

/* ================= actions ================= */
const A = {};

function typeThen(target){
  const chat = target === "respondent" || target.startsWith("q:") || target === "docs" || target === "note" || target === "review";
  if (!chat || matchMedia("(prefers-reduced-motion: reduce)").matches){ goto(target); return; }
  UI.typing = true;
  goto(target);
  clearTimeout(UI.typingT);
  UI.typingT = setTimeout(() => { UI.typing = false; UI.playAnim = true; render(); }, 500);
}
A["start"] = () => typeThen(STATE.loggedIn ? "respondent" : "login_phone");
A["back"] = () => {
  if (UI.sheet){ UI.sheet = null; render(); return; }
  const b = backTarget();
  if (b === "review") UI.returnTo = null;
  goto(b);
};

A["close-menu"] = () => { UI.menuOpen = false; render(); };
A["open-privacy"] = () => { UI.sheet = "privacy"; UI.menuOpen = false; render(); };
A["close-sheet"] = () => { UI.sheet = null; render(); };
A["toggle-lang"] = () => A["set-lang"]({ loc: STATE.locale === "he" ? "en" : "he" });
A["set-lang"] = d => {
  UI.menuOpen = false;
  if (d.loc === STATE.locale){ render(); return; }
  UI.loader = t("langLoading"); render();
  setTimeout(() => {                                    // 10.3 faked language switch, then a real re-render + dir flip
    STATE.locale = d.loc; UI.loader = null;
    applyDir(); saveState(); render();
  }, 1200);
};
A["menu-save"] = () => { UI.menuOpen = false; saveState(); toast(t("savedToast")); };
A["restart"] = () => {
  try { localStorage.removeItem(KEY); } catch(e){}
  MEM = null; stopStream();
  STATE = FRESH();
  Object.assign(UI, { menuOpen:false, sheet:null, loader:null, toast:null, returnTo:null, resFrom:null, resDone:false, followCard:null, offerCard:null, captured:null, readDraft:null, readLoading:false, revClosed:{} });
  applyDir(); render();
};

A["to-login"] = () => goto("login_phone");
A["login-continue"] = () => {
  if (!/^05\d{8}$/.test(STATE.phone)){ UI.phoneErr = true; render(); return; }
  UI.phoneErr = false; UI.resendLeft = 0; goto("login_code");
};
A["resend"] = () => {                                    // 10.2 resend runs a countdown and does nothing else
  if (UI.resendLeft > 0) return;
  UI.resendLeft = 30;
  const tick = () => {
    UI.resendLeft--;
    const b = document.getElementById("resendbtn");
    if (b) b.textContent = UI.resendLeft > 0 ? fmt(t("resendWait"), { s: UI.resendLeft }) : t("resend");
    if (UI.resendLeft > 0) setTimeout(tick, 1000);
  };
  const b = document.getElementById("resendbtn");
  if (b) b.textContent = fmt(t("resendWait"), { s: 30 });
  setTimeout(tick, 1000);
};

A["select-option"] = d => { setSingle(d.q, d.opt); saveState(); render(); };
A["toggle-multi"] = d => { toggleMulti(d.q, d.opt); saveState(); render(); };
A["set-unknown"] = d => {
  if (d.q === "q1"){ const prev = st("q1"); if (!(prev && prev.status === "unknown")) q1Changed(null); }
  STATE.answers[d.q] = { status:"unknown", value:null, detail:null, confidence:null, secondHand:false };
  if (d.q === "q8a") syncSecondHand();
  STATE.branch = currentBranch(); pruneCards(); saveState(); render();
};
A["set-scale"] = d => {
  STATE.answers[d.q] = { status:"answered", value:parseInt(d.v, 10), detail:null, confidence:(st(d.q) || {}).confidence || null, secondHand:false };
  saveState(); render();
};
A["set-conf"] = d => {
  const a = st(d.q); if (!a) return;
  a.confidence = a.confidence === d.conf ? null : d.conf;
  saveState(); render();
};
A["set-nothing"] = d => {
  STATE.answers[d.q] = { status:"answered", value:"__nothing", detail:null, confidence:null, secondHand:false };
  saveState(); render();
};
A["chip-date"] = d => {
  const map = { last_month:{ month:7, year:2026 }, lt_year:{ month:4, year:2026 }, gt_year:{ month:3, year:2025 } };
  STATE.answers[d.q] = { status:"answered", value:{ ...map[d.chip] }, detail:d.chip, confidence:(st(d.q) || {}).confidence || null, secondHand:false };
  saveState(); render();
};
A["skip"] = d => {
  if (d.q === "q1"){ const prev = st("q1"); if (!(prev && prev.status === "skipped")) q1Changed(null); }
  STATE.answers[d.q] = { status:"skipped", value:null, detail:null, confidence:null, secondHand:false };
  STATE.branch = currentBranch(); pruneCards(); saveState();
  A["q-continue"](d);
};
A["q-continue"] = d => {
  if (UI.returnTo){ const r = UI.returnTo; UI.returnTo = null; goto(r); return; }
  UI.lastAdvancedQ = d.q;
  if (d.q === "respondent"){ typeThen("q:q1"); return; }
  const p = pathQuestions(); const i = p.findIndex(x => x.id === d.q);
  if (i >= 0 && i < p.length - 1) typeThen("q:" + p[i+1].id); else typeThen("docs");
};
A["sent-back"] = () => { UI.returnTo = null; goto("review"); };  // re-open review to change and re-send
A["docs-continue"] = () => typeThen("note");
A["note-continue"] = () => typeThen("review");

A["card-dont-have"] = d => { UI.followCard = UI.followCard === d.card ? null : d.card; render(); };
A["card-set"] = d => {
  const cs = cardState(d.card);
  cs.status = d.status; cs.files = []; cs.extracted = null;
  UI.followCard = null;
  UI.offerCard = d.status === "cannot_get" ? d.card : null;
  saveState(); render();
};
A["decline-move"] = () => { UI.offerCard = null; render(); };
A["card-reset"] = d => {
  const cs = cardState(d.card);
  cs.status = "untouched"; cs.files = []; cs.extracted = null;
  if (UI.offerCard === d.card) UI.offerCard = null;
  saveState(); render();
};
A["card-explain"] = d => { UI.sheet = "explain:" + d.card; render(); };
A["card-capture"] = d => { UI.cam = "idle"; UI.captured = null; goto("capture:" + d.card); };
A["open-camera"] = () => {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ UI.cam = "fallback"; render(); return; }
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } })
    .then(s => { UI.stream = s; UI.cam = "on"; render(); })
    .catch(() => { UI.cam = "fallback"; render(); });     // silent fallback, never dead-end
};
A["shutter"] = () => {
  const v = document.getElementById("camvid");
  const c = document.createElement("canvas");
  c.width = (v && v.videoWidth) || 390; c.height = (v && v.videoHeight) || 520;
  try { c.getContext("2d").drawImage(v, 0, 0); UI.captured = c.toDataURL("image/jpeg", .8); }
  catch(e){ UI.captured = null; }
  const id = STATE.screen.split(":")[1];
  stopStream(); goto("read:" + id);
};
A["read-save"] = d => {
  const cs = cardState(d.card);
  cs.status = "attached"; cs.extracted = { ...UI.readDraft };
  const f = { name:"photo.jpg", kind:"image/jpeg", objectUrl:UI.captured || null };
  if (d.card === "DX") cs.files.push(f); else cs.files = [f];
  UI.captured = null;
  goto("docs");
};

A["edit-row"] = d => { UI.returnTo = "review"; goto(d.target); };
A["submit"] = () => {                                    // 10.4 faked submission
  const go = () => {
    UI.loader = t("sending"); render();
    setTimeout(() => { UI.loader = null; STATE.submitted = true; goto("sent"); }, 900);
  };
  const icon = document.querySelector(".sendbtn svg");
  if (icon && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    icon.classList.add("fly");                           // the plane leaves first
    setTimeout(go, 330);
  } else go();
};
A["open-reschedule"] = () => {
  if (STATE.screen !== "reschedule") UI.resFrom = STATE.screen;
  UI.resDone = false; UI.menuOpen = false;
  goto("reschedule");
};
A["choose-slot"] = d => { STATE.rescheduledTo = d.slot; UI.resDone = true; saveState(); render(); };
A["res-done"] = () => {
  const f = UI.resFrom && UI.resFrom !== "reschedule" ? UI.resFrom : "docs";
  UI.resDone = false; goto(f);
};
A["add-calendar"] = () => toast(t("addedCal"));          // 10.6 inert, confirmation only

function onAttach(cardId, file){
  const cs = cardState(cardId);
  let url = null; try { url = URL.createObjectURL(file); } catch(e){}
  const f = { name:file.name, kind:file.type || "", objectUrl:url };
  if (cardId === "DX") cs.files.push(f); else cs.files = [f];
  cs.status = "attached";
  saveState(); render();
}

function handleCode(el){
  el.value = el.value.replace(/\D/g, "").slice(-1);
  if (el.value){
    const nxt = document.querySelector('[data-code="' + (parseInt(el.dataset.code, 10) + 1) + '"]');
    if (nxt) nxt.focus();
  }
  const vals = [...document.querySelectorAll("[data-code]")].map(x => x.value);
  if (vals.length === 4 && vals.every(v => v.length === 1)){
    UI.loader = t("checking"); render();                 // 10.2 any four digits are accepted
    setTimeout(() => { UI.loader = null; STATE.loggedIn = true; goto("landing"); }, 1000);
  }
}
function handleOpenText(el){
  const qid = el.dataset.open; const v = el.value;
  if (v.trim()) STATE.answers[qid] = { status:"answered", value:v, detail:null, confidence:null, secondHand:false };
  else delete STATE.answers[qid];
  saveState();
  const btn = document.querySelector('[data-act="q-continue"][data-q="' + qid + '"]');
  if (btn) btn.disabled = !st(qid);
}
function handleDateSel(el){
  const qid = el.dataset.q;
  const m = parseInt((document.getElementById("msel_" + qid) || {}).value, 10) || null;
  const y = parseInt((document.getElementById("ysel_" + qid) || {}).value, 10) || null;
  if (m && y){
    STATE.answers[qid] = { status:"answered", value:{ month:m, year:y }, detail:null, confidence:(st(qid) || {}).confidence || null, secondHand:false };
    saveState(); render();
  }
}

/* ================= event delegation ================= */
function selectorFor(el){
  let s = "";
  for (const [k, v] of Object.entries(el.dataset))
    s += '[data-' + k.replace(/[A-Z]/g, m => "-" + m.toLowerCase()) + '="' + v + '"]';
  return s || null;
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  const sel = selectorFor(el); const scr = STATE.screen;
  fn(el.dataset, el);
  if (STATE.screen === scr && sel && (document.activeElement === document.body || !document.activeElement)){
    const n = document.querySelector(sel); if (n) n.focus();
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.phone !== undefined){
    STATE.phone = el.value.replace(/\D/g, "").slice(0, 10); saveState();
    if (UI.phoneErr && /^05\d{8}$/.test(STATE.phone)){   // the error clears itself the moment the number is right
      UI.phoneErr = false;
      el.removeAttribute("aria-invalid");
      const er = document.getElementById("phoneerr"); if (er) er.textContent = "";
    }
    return;
  }
  if (el.dataset.code !== undefined){ handleCode(el); return; }
  if (el.dataset.detail){ const a = st(el.dataset.detail); if (a){ a.detail = el.value; saveState(); } return; }
  if (el.dataset.open){ handleOpenText(el); return; }
  if (el.dataset.note !== undefined){ STATE.note = el.value; saveState(); return; }
  if (el.dataset.readfield){ if (UI.readDraft) UI.readDraft[el.dataset.readfield] = el.value; return; }
});
document.addEventListener("click", e => {
  const sm = e.target.closest("details[data-sec] > summary");
  if (sm){ const d = sm.parentElement; UI.revClosed[d.dataset.sec] = d.open; }  // default action flips it after this
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.file){ if (el.files && el.files[0]) onAttach(el.dataset.card, el.files[0]); return; }
  if (el.dataset.capfile){
    if (el.files && el.files[0]){
      try { UI.captured = URL.createObjectURL(el.files[0]); } catch(err){ UI.captured = null; }
      goto("read:" + el.dataset.card);
    }
    return;
  }
  if (el.dataset.datesel){ handleDateSel(el); return; }
});

function applyDir(){
  const he = STATE.locale === "he";
  document.documentElement.lang = he ? "he" : "en";
  document.documentElement.dir = he ? "rtl" : "ltr";
  document.title = he ? "לפני הביקור של יותם · דמו" : "Before Yotam's visit · demo";
}

function confHTML(qd, a){
  const chips = ["sure","roughly","guessing"].map(c =>
    '<button class="chip' + (a && a.confidence === c ? " sel" : "") + '" data-act="set-conf" data-q="' + qd.id + '" data-conf="' + c + '" aria-pressed="' + !!(a && a.confidence === c) + '">' + t("conf_" + c) + "</button>"
  ).join("");
  return '<div class="confwrap"><p class="conflabel" id="confl_' + qd.id + '">' + t("confLabel") + '</p><div class="chips" role="group" aria-labelledby="confl_' + qd.id + '">' + chips + "</div></div>";
}

function optListHTML(qd, a){
  const multi = qd.type === "multi";
  let h = '<div class="opts" role="group" aria-label="' + esc(L(qd.text)) + '">';
  (qd.options || []).forEach(o => {
    const sel = !!(a && a.status === "answered" && (multi ? a.value.includes(o.id) : a.value === o.id));
    let dis = false;
    if (multi && a && a.status === "answered"){
      const exSel = (qd.exclusiveOptions || []).some(x => a.value.includes(x));
      if (exSel && !a.value.includes(o.id)) dis = true;   // exclusives clear and disable the rest
    }
    h += '<button class="opt' + (sel ? " sel" : "") + '" data-act="' + (multi ? "toggle-multi" : "select-option") + '" data-q="' + qd.id + '" data-opt="' + o.id + '" aria-pressed="' + sel + '"' + (dis ? " disabled" : "") + '><span class="mark" aria-hidden="true">' + (sel ? "✓" : "") + "</span><span>" + L(o.text) + "</span></button>";
    if (sel && o.detail)
      h += '<input class="txt det" id="det_' + qd.id + '" data-detail="' + qd.id + '" value="' + esc(a.detail) + '" placeholder="' + esc(t("detailPh")) + '" aria-label="' + esc(L(o.text)) + '">';
  });
  if (qd.unknown){
    const us = !!(a && a.status === "unknown");
    h += '<button class="opt' + (us ? " sel" : "") + '" data-act="set-unknown" data-q="' + qd.id + '" aria-pressed="' + us + '"><span class="mark" aria-hidden="true">' + (us ? "✓" : "") + "</span><span>" + (qd.unknownLabel ? L(qd.unknownLabel) : t("dontKnow")) + "</span></button>";
  }
  return h + "</div>";
}

function scaleHTML(qd, a){
  const sel = a && a.status === "answered" ? a.value : null;
  let h = '<div class="anch" aria-hidden="true"><span>' + L(qd.scale.minLabel) + "</span><span>" + L(qd.scale.maxLabel) + '</span></div><div class="dots" role="group" aria-label="' + esc(L(qd.scale.minLabel)) + " – " + esc(L(qd.scale.maxLabel)) + '">';
  for (let i = qd.scale.min; i <= qd.scale.max; i++)
    h += '<button class="dot' + (sel === i ? " sel" : "") + '" data-act="set-scale" data-q="' + qd.id + '" data-v="' + i + '" aria-pressed="' + (sel === i) + '">' + i + "</button>";
  h += "</div>";
  if (qd.unknown){
    const us = !!(a && a.status === "unknown");
    h += '<div class="chips"><button class="chip' + (us ? " sel" : "") + '" data-act="set-unknown" data-q="' + qd.id + '" aria-pressed="' + us + '">' + t("dontKnow") + "</button></div>";
  }
  return h;
}

function approxDateHTML(qd, a){
  const chips = [["last_month","chipLastMonth"],["lt_year","chipLtYear"],["gt_year","chipGtYear"]];
  let h = '<div class="chips">';
  chips.forEach(([id, k]) => {
    const sel = !!(a && a.status === "answered" && a.detail === id);
    h += '<button class="chip' + (sel ? " sel" : "") + '" data-act="chip-date" data-q="' + qd.id + '" data-chip="' + id + '" aria-pressed="' + sel + '">' + t(k) + "</button>";
  });
  const us = !!(a && a.status === "unknown");
  h += '<button class="chip' + (us ? " sel" : "") + '" data-act="set-unknown" data-q="' + qd.id + '" aria-pressed="' + us + '">' + t("dontKnow") + "</button></div>";
  const v = (a && a.status === "answered" && a.value) || {};
  h += '<div class="datesels">';
  h += '<label class="vh" for="msel_' + qd.id + '">' + t("monthLabel") + '</label><select id="msel_' + qd.id + '" data-datesel="month" data-q="' + qd.id + '"><option value="">' + t("monthLabel") + "</option>" +
       MONTHS[STATE.locale].map((m, i) => '<option value="' + (i+1) + '"' + (v.month === i+1 ? " selected" : "") + ">" + m + "</option>").join("") + "</select>";
  let yopts = '<option value="">' + t("yearLabel") + "</option>";
  for (let y = 2026; y >= 2019; y--) yopts += '<option value="' + y + '"' + (v.year === y ? " selected" : "") + ">" + y + "</option>";
  h += '<label class="vh" for="ysel_' + qd.id + '">' + t("yearLabel") + '</label><select id="ysel_' + qd.id + '" data-datesel="year" data-q="' + qd.id + '">' + yopts + "</select></div>";
  return h;
}

function openTextHTML(qd, a){
  const isNothing = !!(a && a.status === "answered" && a.value === "__nothing");
  const txt = a && a.status === "answered" && !isNothing ? a.value : "";
  let h = '<textarea class="txt area" data-open="' + qd.id + '" aria-label="' + esc(L(qd.text)) + '">' + esc(txt) + "</textarea>";
  if (qd.nothingLabel)
    h += '<div class="chips"><button class="chip' + (isNothing ? " sel" : "") + '" data-act="set-nothing" data-q="' + qd.id + '" aria-pressed="' + isNothing + '">' + L(qd.nothingLabel) + "</button></div>";
  return h;
}

function inputHTML(qd, a){
  switch (qd.type){
    case "single": case "bucketed": case "multi": return optListHTML(qd, a);
    case "scale": return scaleHTML(qd, a);
    case "approx_date": return approxDateHTML(qd, a);
    case "open_text": return openTextHTML(qd, a);
  }
  return "";
}

function variantHTML(qd, a){
  if (qd.id !== "q8a" || !a || a.status !== "answered" || a.value !== "someone_else") return "";
  const parent = ["mother","father"].includes(STATE.respondent);
  return '<p class="variant">' + t(parent ? "shParent" : "shGrand") + "</p>";
}

    '<path d="M22 17c5 2.5 9.5 1.5 12.5-3.5M40.5 8.5C43 15 41 22 36 26c-1.8 1.5-2.5 4-2 7" stroke="#85C226" stroke-width="3.4" stroke-linecap="round"/></svg>';
}

const ARROW_FWD = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7.5 3.5L3 8l4.5 4.5"/></svg>';
const PLANE = '<svg width="17" height="17" viewBox="0 0 16 16" fill="#fff" aria-hidden="true"><path d="M1.5 14.5V9.4L9.5 8 1.5 6.6V1.5L15 8z"/></svg>';
const PENCIL = '<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 2.5l2 2L5 13l-3 1 1-3z"/></svg>';

function clinicGrp(bubbles, cls){
  return '<div class="grp' + (cls ? " " + cls : "") + '"><span class="av mini">' + logoSVG(14) + '</span><div class="col">' + bubbles + "</div></div>";
}
function typingHTML(){
  return '<div class="grp arrive"><span class="av mini">' + logoSVG(14) + '</span><div class="typing" role="status" aria-label="…"><i></i><i></i><i></i></div></div>';
}
function bubHTML(inner, extra){
  return '<div class="bub"' + (extra || "") + ">" + inner + "</div>";
}
function meBubble(qd){
  const a = st(qd.id); if (!a) return "";
  let inner = answerDisp(qd, a);
  const tags = [];
  if (a.confidence) tags.push(t("conf_" + a.confidence));
  if (a.secondHand) tags.push(t("secondHand"));
  if (tags.length) inner += '<span class="metag">' + tags.join(" · ") + "</span>";
  const pop = UI.playAnim && UI.lastAdvancedQ === qd.id ? " pop" : "";
  return '<div class="megrp' + pop + '"><button class="me" data-act="edit-answer" data-q="' + qd.id + '" aria-label="' + esc(L(qd.text)) + ". " + t("tapToEdit") + '">' + inner + '</button><span class="av mini">' + USER_AV + "</span></div>";
}

/* the fixed opening of the conversation: greeting, appointment, promise, time */
function landingBubbles(){
  return clinicGrp.call(null, 
    bubHTML(t("landingFrom")) +
    bubHTML('<span class="bt">' + t("landingTitle") + '</span><div class="apc"><span class="bt">' + t("apptWhen") + '</span><span class="bm">' + t("apptWhere") + " · " + t("apptDoc") + "</span></div>") +
    bubHTML('<span class="promise">' + t("landingPromise") + "</span>") +
    bubHTML(t("landingTime")),
    UI.playAnim && STATE.screen === "landing" ? "stag" : ""
  );
}

/* every answered question so far, as Q-bubble + tappable answer bubble */
function historyHTML(upTo){
  const seq = [q("respondent")].concat(pathQuestions());
  let h = "", firstAnswer = true;
  for (const qd of seq){
    if (qd.id === upTo) break;
    const a = st(qd.id); if (!a) continue;
    h += clinicGrp(bubHTML(esc(L(qd.text)))) + meBubble(qd);
    if (firstAnswer){ h += '<div class="mehint">' + PENCIL + t("tapToEdit") + "</div>"; firstAnswer = false; }
    CASE.questions.filter(c => c.parent === qd.id && isActiveQ(c)).forEach(c => {
      if (!st(c.id)) return;
      h += clinicGrp(bubHTML(esc(L(c.text)))) + meBubble(c);
    });
  }
  return h;
}

/* the current question: bubble + quick-reply pills + confidence + inline reveals */
function currentQHTML(qd){
  const a = st(qd.id);
  let h = clinicGrp(bubHTML('<span class="qt" tabindex="-1">' + esc(L(qd.text)) + "</span>" + (qd.help ? '<span class="bm">' + esc(L(qd.help)) + "</span>" : "")));
  h += inputHTML(qd, a);
  if (qd.confidence) h += confHTML(qd, a);
  CASE.questions.filter(c => c.parent === qd.id).forEach(c => {
    if (!isActiveQ(c)) return;                            // inline reveals appear and disappear with the parent answer
    const ca = st(c.id);
    h += '<div class="inline">' + clinicGrp(bubHTML(esc(L(c.text)))) + inputHTML(c, ca) + (c.confidence ? confHTML(c, ca) : "") + variantHTML(c, ca) + "</div>";
  });
  return h;
}

/* edit mode: the tapped question alone; the rest of the conversation hides until "Next" */
function editBody(){
  const qd = q(UI.editQ);
  let h = '<div class="stream">';
  const wrap = UI.playAnim ? '<div class="swrap arrive">' : '<div class="swrap">';
  h += wrap + '<span class="editbanner">' + PENCIL + t("editTitle") + "</span>" + currentQHTML(qd) + "</div>";
  return h + "</div>";
}

/* one accumulating conversation from landing to sent */
function chatBody(){
  const s = STATE.screen;
  let h = '<div class="stream">';
  h += landingBubbles();
  if (s === "landing"){
    h += '<div class="pillrow"><button class="pill-start" data-act="start">' + t("startChat") + '</button><button class="pill-ghost" data-act="open-privacy">' + t("whatIsThis") + "</button></div>";
    return h + "</div>";
  }
  const curId = s === "respondent" ? "respondent" : s.startsWith("q:") ? s.slice(2) : null;
  h += historyHTML(curId);
  if (UI.typing) return h + typingHTML() + "</div>";     // the clinic is writing the next message
  const wrap = UI.playAnim ? '<div class="swrap arrive">' : '<div class="swrap">';
  if (curId) h += wrap + currentQHTML(q(curId)) + "</div>";
  else if (s === "docs" || s.startsWith("capture:") || s.startsWith("read:")) h += wrap + docsSection() + "</div>";
  else if (s === "note") h += wrap + noteSection() + "</div>";
  else if (s === "review") h += wrap + reviewSection() + "</div>";
  return h + "</div>";
}

function langBottom(){
  const toEn = STATE.locale === "he";                     // the switch names its action, in the target language
  return '<div class="langbottom"><button class="btn-text" data-act="toggle-lang" lang="' + (toEn ? "en" : "he") + '">' + (toEn ? "Switch to English" : "מעבר לעברית") + "</button></div>";
}

function loginCodeBody(){
  const shown = STATE.phone ? STATE.phone.slice(0,3) + "-" + STATE.phone.slice(3) : "05X-XXXXXXX";

    boxes += '<input class="codebox" type="text" inputmode="numeric" maxlength="2" data-code="' + i + '" aria-label="' + (i+1) + '">';
  return '<div class="loginwrap"><div class="panel center"><h1 tabindex="-1">' + t("codeTitle") + "</h1>" +
    "<p>" + fmt(t("codeSent"), { phone:'<bdo dir="ltr">' + esc(shown) + "</bdo>" }) + "</p>" +

function thumbsHTML(files){
  if (!files || !files.length) return "";
  const th = files.map(f =>
    f.objectUrl && (f.kind || "").startsWith("image")
      ? '<img class="thumb" src="' + f.objectUrl + '" alt="' + esc(f.name) + '">'
      : '<span class="ph" role="img" aria-label="' + esc(f.name) + '"></span>'
  ).join("");
  return '<div class="thumbs">' + th + '</div><p class="small mut">' + files.map(f => esc(f.name)).join(", ") + "</p>";
}

function cardStateHTML(c){
  const cs = STATE.cards[c.id]; const s = cs ? cs.status : "untouched";
  if (s === "attached"){
    let h = '<div class="cardstate"><p class="stt">✓ ' + t("stAttached") + "</p>" + thumbsHTML(cs.files);
    if (cs.extracted) h += '<p class="small mut">' + ["docType","date","place","childName"].map(k => esc(cs.extracted[k])).filter(Boolean).join(" · ") + "</p>";
    h += '<button class="btn-text" data-act="card-reset" data-card="' + c.id + '">' + t("change") + "</button></div>";
    return h;
  }
  if (s !== "untouched"){
    const map = { will_bring:"stWillBring", will_get:"stWillGet", add_later:"stAddLater", cannot_get:"stCannotGet" };
    let h = '<div class="cardstate"><p class="stt">' + t(map[s]) + "</p>";
    if (s === "cannot_get" && UI.offerCard === c.id)
      h += '<div class="offer"><p>' + t("moveOffer") + '</p><button class="btn-sec" data-act="open-reschedule">' + t("moveAppt") + '</button><button class="btn-sec" data-act="decline-move">' + t("comeAnyway") + "</button></div>";
    h += '<button class="btn-text" data-act="card-reset" data-card="' + c.id + '">' + t("change") + "</button></div>";
    return h;
  }
  const acc = c.kind === "video" ? "video/*" : "image/*,.pdf";
  const open = UI.followCard === c.id;
  let h = '<div class="cardacts"><div class="actrow">';
  h += '<label class="filelab">' + ICONS.find + "<span>" + t("findOnPhone") + '</span><input type="file" class="vh" accept="' + acc + '" data-file="1" data-card="' + c.id + '"></label>';
  if (c.kind === "paper") h += '<button class="btn-sec" data-act="card-capture" data-card="' + c.id + '">' + ICONS.photo + "<span>" + t("takePhoto") + "</span></button>";
  h += "</div>";
  h += '<button class="dhbtn" data-act="card-dont-have" data-card="' + c.id + '" aria-expanded="' + open + '">' + (c.kind === "video" ? t("dontHaveVideo") : t("dontHaveIt")) + "</button>";
  if (c.explain) h += '<button class="btn-text" data-act="card-explain" data-card="' + c.id + '">' + ICONS.what + "<span>" + t("whatIsThis") + "</span></button>";
  h += "</div>";
  if (open){
    h += '<div class="follow">';
    [["will_bring","willBringOpt"],["will_get","willGetOpt"],["add_later","addLaterOpt"],["cannot_get","cantGetOpt"]].forEach(([sid, k]) => {
      h += '<button class="opt" data-act="card-set" data-card="' + c.id + '" data-status="' + sid + '"><span class="mark" aria-hidden="true"></span><span>' + t(k) + "</span></button>";
    });
    h += "</div>";
  }
  return h;
}

function answerDisp(qd, a){
  if (a.status === "unknown") return qd.unknownLabel ? L(qd.unknownLabel) : t("dontKnow");
  if (a.status === "skipped") return t("skippedWord");
  const v = a.value;
  switch (qd.type){
    case "single": case "bucketed": {
      const o = (qd.options || []).find(x => x.id === v);
      let s = o ? L(o.text) : esc(v);
      if (a.detail) s += ": " + esc(a.detail);
      return s;
    }
    case "multi": {
      let s = v.map(id => { const o = qd.options.find(x => x.id === id); return o ? L(o.text) : esc(id); }).join(", ");
      if (a.detail) s += ": " + esc(a.detail);
      return s;
    }
    case "scale": return v + " / " + qd.scale.max;
    case "approx_date": return MONTHS[STATE.locale][v.month - 1] + " " + v.year;
    case "open_text": return v === "__nothing" ? L(qd.nothingLabel) : esc(v);
  }
  return "";
}

function summaryLine(){
  const act = CASE.questions.filter(isActiveQ);
  const dk = act.filter(x => st(x.id) && st(x.id).status === "unknown").length;
  const pass = act.filter(x => st(x.id) && st(x.id).status === "skipped").length;
  let P = 0, V = 0;
  namedCards().concat([CASE.cards.find(c => c.id === "DX")]).forEach(c => {
    const cs = STATE.cards[c.id];
    if (!cs || cs.status !== "attached") return;
    if (c.kind === "video") V++;
    else P += c.id === "DX" ? Math.max(1, cs.files.length) : 1;
  });
  const terms = [t("yourAnswers")];                       // any zero term is dropped, never printed as "0"
  if (P) terms.push(plural(P, "sumDocs1", "sumDocsN"));
  if (V) terms.push(plural(V, "sumVideos1", "sumVideosN"));
  if (dk) terms.push(plural(dk, "sumDK1", "sumDKN"));
  if (pass) terms.push(plural(pass, "sumPass1", "sumPassN"));
  return terms.join(" · ");
}

function segIndex(){
  const s = STATE.screen, p = pathQuestions();
  if (s === "respondent") return 0;
  if (s.startsWith("q:")){ const i = p.findIndex(x => "q:" + x.id === s); return 1 + Math.max(0, i); }
  if (s === "docs" || s.startsWith("capture:") || s.startsWith("read:")) return 1 + p.length;
  if (s === "note") return 2 + p.length;
  if (s === "review") return 3 + p.length;
  return 0;
}

function progressPct(){
  const s = STATE.screen;
  if (s === "review" || s === "sent") return 100;
  if (!st("q1")) return 10;                               // one step already filled: motivation from the first screen
  const total = 4 + pathQuestions().length;               // [1] + path + [D] + [C] + [V]
  return Math.round(((segIndex() + 1) / total) * 100);    // position-driven, never answer-driven
}

function composerHTML(){
  const s = STATE.screen;
  let left = "", right = "";
  if (UI.editQ){
    right = '<button class="skipmini" data-act="edit-cancel">' + t("cancel") + "</button>";
    left = '<button class="nextbtn" data-act="edit-done"' + (st(UI.editQ) ? "" : " disabled") + ">" + t("cont") + ARROW_FWD + "</button>";
  } else if (s === "respondent" || s.startsWith("q:")){
    const qd = s === "respondent" ? q("respondent") : q(s.slice(2));
    if (!qd) return "";
    right = qd.notInPath ? "<span></span>" : '<button class="skipmini" data-act="skip" data-q="' + qd.id + '">' + t("skip") + "</button>";
    left = '<button class="nextbtn" data-act="q-continue" data-q="' + qd.id + '"' + (st(qd.id) ? "" : " disabled") + ">" + t("cont") + ARROW_FWD + "</button>";
  } else if (s === "docs"){
    right = "<span></span>";
    left = '<button class="nextbtn" data-act="docs-continue">' + t("cont") + ARROW_FWD + "</button>";
  } else if (s === "note"){
    right = "<span></span>";
    left = '<button class="nextbtn" data-act="note-continue">' + t("cont") + ARROW_FWD + "</button>";
  } else if (s === "review"){
    right = "<span></span>";
    left = '<button class="sendbtn" data-act="submit">' + t("sendWord") + PLANE + "</button>";
  } else return "";
  if (UI.typing){
    right = right.replace("<button ", "<button disabled ");
    left = left.replace("<button ", "<button disabled ");
  }
  const total = 4 + pathQuestions().length;
  const sr = st("q1") ? fmt(t("stepOf"), { a: segIndex() + 1, b: total }) : t("stepStart");
  const pct = progressPct();
  let fill = '<div class="pfill" style="width:' + pct + '%"></div>';
  if (UI.playAnim && UI.prevPct != null && pct > UI.prevPct)
    fill = '<div class="pfill grow" style="width:' + pct + '%;--gfrom:' + (UI.prevPct / pct).toFixed(3) + '"></div>';
  UI.prevPct = pct;
  return '<footer class="cwrap"><div class="pwrap"><div class="pbar">' + fill + "</div></div>" +
    '<p class="vh" aria-live="polite">' + sr + "</p>" +
    '<div class="cbar">' + right + left + "</div></footer>";
}

function screenBody(){
  const s = STATE.screen;
  if (s === "splash") return splashBody();
  if (s === "login_phone") return loginPhoneBody();
  if (s === "login_code") return loginCodeBody();
  if (s === "sent") return sentPage();
  if (UI.editQ) return editBody();
  if (s.startsWith("capture:") || s.startsWith("read:") || s === "reschedule"){
    const inner = s === "reschedule" ? rescheduleBody() : s.startsWith("capture:") ? captureBody(s.split(":")[1]) : readBody(s.split(":")[1]);
    return '<div class="panelbar"><button class="btn-text" data-act="back">' + t("back") + '</button></div><div class="panel">' + inner + "</div>";
  }
  return chatBody();
}

function render(){
  pruneCards();
  const prev = UI.lastScreen, prevEdit = UI.lastEdit;
  const prevContent = document.getElementById("content");
  const prevScroll = prevContent ? prevContent.scrollTop : 0;   // innerHTML rebuild resets it; carry it over
  document.getElementById("app").innerHTML =
    headerHTML() + '<main id="content" class="content">' + screenBody() + "</main>" + composerHTML() + overlaysHTML();
  const v = document.getElementById("camvid");
  if (v && UI.stream) v.srcObject = UI.stream;
  const content = document.getElementById("content");
  const chat = !UI.editQ && !/^(login_|capture:|read:)/.test(STATE.screen) && STATE.screen !== "reschedule" && STATE.screen !== "sent" && STATE.screen !== "splash";
  const stream = content && content.querySelector(".stream");
  if (UI.focus){
    const el = document.querySelector(UI.focus);
    if (el) el.focus();
    UI.focus = null;
  } else if (prev !== STATE.screen || prevEdit !== UI.editQ){
    UI.streamPad = 0;
    if (chat && content){
      const anchor = stream && stream.lastElementChild;
      if (STATE.screen === "landing" || !anchor){ content.scrollTop = 0; }
      else {
        let last = null;                                 // the newest message before the arriving block
        for (const m of stream.querySelectorAll(".bub, .me")){ if (anchor.contains(m)) break; last = m; }
        if (last){
          const cr = content.getBoundingClientRect(), lr = last.getBoundingClientRect();
          const want = Math.max(0, (lr.top - cr.top) + lr.height / 2);          // half of it stays visible
          let max = content.scrollHeight - content.clientHeight;
          let pad = 0, guard = 0;                        // grow a spacer until the position is reachable;
          while (want > max + 1 && guard++ < 5){         // iterative, because min-height slack absorbs padding
            pad += Math.ceil(want - max) + 4;
            stream.style.paddingBottom = pad + "px";
            max = content.scrollHeight - content.clientHeight;
          }
          if (pad) UI.streamPad = pad;
          content.scrollTop = want;
        } else content.scrollTop = 0;
      }
    }
    else if (content) content.scrollTop = 0;
    if (STATE.screen === "login_code"){
      const b = document.querySelector('[data-code="0"]'); if (b) b.focus();
    } else {
      const hd = document.querySelector("#content .qt[tabindex], #content h1[tabindex]"); if (hd) hd.focus();
    }
  } else if (chat && content){
    if (stream && UI.streamPad) stream.style.paddingBottom = UI.streamPad + "px";  // spacer survives re-renders
    content.scrollTop = prevScroll;                       // pill taps and typing swaps keep their place
  }
  UI.lastScreen = STATE.screen;
  UI.lastEdit = UI.editQ;
  UI.playAnim = false;                                   // consumed; intra-screen re-renders stay still
}

/* ============ back-navigation, option B: tap your answer to edit ============ */
UI.editQ = null; UI.editSnap = null; UI.lastEdit = null;
UI.playAnim = false; UI.typing = false; UI.typingT = null; UI.lastAdvancedQ = null; UI.prevPct = null; UI.streamPad = 0;

A["edit-answer"] = d => {
  let qd = q(d.q);
  if (qd && qd.screen === false) qd = q(qd.parent);       // an inline answer opens with its parent for context
  if (!qd) return;
  UI.editQ = qd.id;
  UI.editSnap = JSON.stringify({ answers: STATE.answers, respondent: STATE.respondent, branch: STATE.branch });
  UI.playAnim = true;
  render();
};
A["edit-cancel"] = () => {
  if (UI.editSnap){
    const snap = JSON.parse(UI.editSnap);
    STATE.answers = snap.answers; STATE.respondent = snap.respondent; STATE.branch = snap.branch;
  }
  UI.editQ = null; UI.editSnap = null;
  pruneCards(); saveState(); render();
};
A["edit-done"] = () => {
  UI.editQ = null; UI.editSnap = null;
  const s = STATE.screen;                                 // an edited q1 can strand the current screen on an abandoned branch
  if (s.startsWith("q:")){
    const qd = q(s.slice(2));
    if (!qd || !isActiveQ(qd)){
      const p = pathQuestions();
      const nxt = p.find(x => !st(x.id));
      STATE.screen = nxt ? "q:" + nxt.id : "docs";
    }
  }
  saveState(); render();
};
A["goto-docs"] = () => { UI.editQ = null; goto("docs"); };
A["goto-note"] = () => { UI.editQ = null; goto("note"); };
{
  const restartBase = A["restart"];
  A["restart"] = () => {
    UI.editQ = null; UI.editSnap = null;
    clearTimeout(UI.typingT); UI.typing = false; UI.lastAdvancedQ = null; UI.prevPct = null;
    restartBase();
  };
}

/* ================= boot ================= */
loadState();
applyDir();
render();

/* debug hooks for automated walkthroughs; not part of the product surface */
window.__app = {
  get STATE(){ return STATE; }, UI, A, goto, render, CASE,
  testAttach(id, name){
    const cs = cardState(id);
    const f = { name: name || "file.jpg", kind:"image/jpeg", objectUrl:null };
    if (id === "DX") cs.files.push(f); else cs.files = [f];
    cs.status = "attached"; saveState(); render();
  }
};
</script>
</body>
