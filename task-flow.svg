<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 510" width="1240" height="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a3a38"/>
    </marker>
  </defs>

  <rect width="1240" height="510" fill="#fbfaf7"/>

  <text x="60" y="52" font-size="23" font-weight="600" fill="#14140f">Pre-visit intake · caregiver task flow</text>
  <text x="60" y="76" font-size="13.5" fill="#6c6a64">Web app, opened on the phone from the appointment reminder. Hebrew by default. One path, no branches.</text>
  <line x1="60" y1="98" x2="1180" y2="98" stroke="#d8d4c4" stroke-width="1"/>

  <!-- wrap connector -->
  <path d="M1154 178 H1192 V254 H155 V284" fill="none" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ROW 1 -->
  <g>
    <rect x="60" y="140" width="190" height="76" rx="3" fill="#fff" stroke="#3a3a38" stroke-width="1.4"/>
    <text x="80" y="173" font-size="15" fill="#14140f">Open the link</text>
    <text x="80" y="193" font-size="15" fill="#14140f">from the SMS</text>

    <line x1="250" y1="178" x2="282" y2="178" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="286" y="140" width="190" height="76" rx="3" fill="#fff" stroke="#3a3a38" stroke-width="1.4"/>
    <text x="306" y="173" font-size="15" fill="#14140f">Log in with a phone</text>
    <text x="306" y="193" font-size="15" fill="#14140f">number and a code</text>

    <line x1="476" y1="178" x2="508" y2="178" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="512" y="140" width="190" height="76" rx="3" fill="#fff" stroke="#3a3a38" stroke-width="1.4"/>
    <text x="532" y="173" font-size="15" fill="#14140f">See what this is for,</text>
    <text x="532" y="193" font-size="15" fill="#14140f">and who will read it</text>

    <line x1="702" y1="178" x2="734" y2="178" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="738" y="140" width="190" height="76" rx="3" fill="#fff" stroke="#14140f" stroke-width="2.4"/>
    <text x="758" y="173" font-size="15" font-weight="600" fill="#14140f">Answer up to nine</text>
    <text x="758" y="193" font-size="15" font-weight="600" fill="#14140f">adaptive questions</text>

    <line x1="928" y1="178" x2="960" y2="178" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="964" y="140" width="190" height="76" rx="3" fill="#fff" stroke="#14140f" stroke-width="2.4"/>
    <text x="984" y="173" font-size="15" font-weight="600" fill="#14140f">Attach the specific</text>
    <text x="984" y="193" font-size="15" font-weight="600" fill="#14140f">documents we name</text>
  </g>

  <!-- ROW 2 -->
  <g>
    <rect x="60" y="284" width="190" height="76" rx="3" fill="#fff" stroke="#3a3a38" stroke-width="1.4"/>
    <text x="80" y="317" font-size="15" fill="#14140f">Add anything else</text>
    <text x="80" y="337" font-size="15" fill="#14140f">in your own words</text>

    <line x1="250" y1="322" x2="282" y2="322" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="286" y="284" width="190" height="76" rx="3" fill="#fff" stroke="#3a3a38" stroke-width="1.4"/>
    <text x="306" y="317" font-size="15" fill="#14140f">Review it all, gaps</text>
    <text x="306" y="337" font-size="15" fill="#14140f">and corrections</text>

    <line x1="476" y1="322" x2="508" y2="322" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="512" y="284" width="190" height="76" rx="3" fill="#14140f" stroke="#14140f" stroke-width="1.4"/>
    <text x="532" y="317" font-size="15" font-weight="600" fill="#fbfaf7">Send it to the</text>
    <text x="532" y="337" font-size="15" font-weight="600" fill="#fbfaf7">clinic</text>

    <line x1="702" y1="322" x2="734" y2="322" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="738" y="284" width="190" height="76" rx="3" fill="#fff" stroke="#3a3a38" stroke-width="1.4"/>
    <text x="758" y="317" font-size="15" fill="#14140f">See what to bring</text>
    <text x="758" y="337" font-size="15" fill="#14140f">on the day</text>
  </g>

  <line x1="60" y1="404" x2="1180" y2="404" stroke="#d8d4c4" stroke-width="1"/>
  <g font-size="12.5" fill="#6c6a64">
    <text x="60" y="430">The two heavier steps are the product. The questions adapt to each answer, and what is answered there changes which documents get named.</text>
    <text x="60" y="452">Sending is available from the second step onward. An unfinished form still goes, and still helps.</text>
  </g>
  <text x="60" y="486" font-size="11" fill="#8b8985">Group 7 · AI Product Sprint 2026 · Challenge #6, pediatric pulmonology · Direction B, The Named Ask · P0 scope</text>
</svg>
