name: Deploy prototype to GitHub Pages

# Serves only the pre-visit intake prototype, not the rest of the repository.
# previsit-intake.html is the single source of truth; it is copied to
# index.html at deploy time so the site root opens the app directly.

on:
  push:
    branches: [main]
    paths:
      - previsit-intake.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the prototype as the site root
        run: |
          mkdir _site
          cp previsit-intake.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
